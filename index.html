<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fffdf2" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>板块流向 · 咕咕鸡</title>
  <style>
    :root {
      --primary: #fbc02d;
      --secondary: #2c3e50;
      --up: #e74c3c;
      --down: #27ae60;
      --neutral: #999;
      --bg: #fffdf2;
      --card: #fff;
      --border: #ffecb3;
      --muted: #888;
      --text: #333;
      --warn: #c27c0e;
      --mix: #6c5ce7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 10px;
    }
    .app { max-width: 860px; margin: 0 auto; padding-bottom: 70px; }
    .header { text-align: center; margin-bottom: 12px; }
    .header h1 { color: var(--secondary); margin: 0; font-size: 22px; }
    .home-link {
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px;
      color: #9a6a00; font-size: .85rem; font-weight: 700; text-decoration: none;
      background: #fff7d1; border: 1px solid #ffe58a; border-radius: 999px;
      padding: 6px 14px; box-shadow: 0 2px 8px rgba(251,192,45,.12);
    }
    .sub { color: var(--muted); font-size: 12px; line-height: 1.6; margin-top: 8px; }
    .card {
      background: var(--card); border-radius: 16px; padding: 14px;
      box-shadow: 0 8px 20px rgba(251,192,45,.05); margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn {
      padding: 8px 12px; border-radius: 8px; border: none; cursor: pointer;
      font-weight: 700; font-size: 13px; background: var(--primary); color: #000;
      box-shadow: 0 4px 10px rgba(251,192,45,.25);
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
    .btn.secondary { background: #f5f5f5; color: #666; box-shadow: none; border: 1px solid #eee; }
    .btn.active { background: #fff3c4; border: 1px solid var(--primary); color: #333; box-shadow: none; }
    .seg { display: flex; gap: 6px; flex-wrap: wrap; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
      background: #fafafa; border: 1px solid #eee; border-radius: 999px; padding: 5px 10px; color: #666;
    }
    .meta-row {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      flex-wrap: wrap; margin-bottom: 8px;
    }
    .stats {
      display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px;
    }
    @media (min-width: 640px) { .stats { grid-template-columns: repeat(4, minmax(0,1fr)); } }
    .stat-box {
      background: #fffaf0; border: 1px solid #ffe9a8; border-radius: 12px; padding: 10px;
    }
    .stat-box .k { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .stat-box .v { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat-box .s { display: block; margin-top: 2px; font-size: 11px; color: #999; }
    .cols {
      display: grid; grid-template-columns: 1fr; gap: 12px;
    }
    @media (min-width: 720px) { .cols { grid-template-columns: 1fr 1fr; } }
    .section-title {
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 800; margin-bottom: 10px; color: var(--secondary);
    }
    .hint { font-weight: 500; font-size: 11px; color: var(--muted); }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .row {
      border: 1px solid #f0e6c0; border-radius: 12px; padding: 10px 12px;
      background: #fffef9; cursor: pointer; transition: .12s ease;
    }
    .row:hover { border-color: var(--primary); transform: translateY(-1px); }
    .row.open { border-color: var(--primary); box-shadow: 0 4px 12px rgba(251,192,45,.15); }
    .row-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .rank {
      width: 22px; height: 22px; border-radius: 6px; background: #fff3c4;
      color: #8a6d00; font-size: 12px; font-weight: 800; display: inline-flex;
      align-items: center; justify-content: center; margin-right: 6px; flex: 0 0 auto;
    }
    .rank.hot { background: #ffe0e0; color: #c0392b; }
    .name { font-weight: 800; font-size: 15px; }
    .code { color: var(--muted); font-size: 11px; margin-left: 4px; font-weight: 500; }
    .right { text-align: right; font-variant-numeric: tabular-nums; }
    .flow { font-size: 16px; font-weight: 800; }
    .chg { font-size: 13px; font-weight: 700; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .muted { color: var(--muted); }
    .bar-wrap { margin-top: 8px; height: 6px; background: #f2f2f2; border-radius: 99px; overflow: hidden; }
    .bar { height: 100%; border-radius: 99px; }
    .bar.in { background: linear-gradient(90deg, #ffb4b4, #e74c3c); }
    .bar.out { background: linear-gradient(90deg, #a8e6c1, #27ae60); }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .tag {
      font-size: 11px; border-radius: 999px; padding: 2px 8px; background: #f5f5f5; color: #666;
      border: 1px solid #eee;
    }
    .tag.up { background: #ffeaea; color: #c0392b; border-color: #ffd0d0; }
    .tag.down { background: #e9f8ef; color: #1e8449; border-color: #c6edd5; }
    .tag.warn { background: #fff4e0; color: #a66b00; border-color: #ffe0a8; }
    .tag.mix { background: #f0ecff; color: #5b4bb7; border-color: #d9d1ff; }
    .detail {
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed #f0e0a0;
      font-size: 12px; color: #555;
    }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
    .kv { display: flex; justify-content: space-between; gap: 8px; }
    .kv b { font-variant-numeric: tabular-nums; }
    .members { margin-top: 8px; }
    .mrow {
      display: flex; justify-content: space-between; gap: 8px; padding: 5px 0;
      border-bottom: 1px solid #f7f1d8; font-size: 12px;
    }
    .mrow:last-child { border-bottom: none; }
    .empty { text-align: center; color: var(--muted); padding: 28px 10px; font-size: 13px; }
    .footer-note { text-align: center; color: #aaa; font-size: 11px; margin-top: 8px; line-height: 1.6; }
    .auto-on { color: #206c39; font-weight: 700; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <a class="home-link" href="https://guguji.icu" title="返回主页">← 返回主页</a>
      <h1>🐔 板块流向</h1>
      <div class="sub">
        实时识别 A 股行业 / 概念板块主力资金流向（东财口径）。盘中自动刷新，点击板块可下钻成分股。
      </div>
    </div>

    <div class="card toolbar">
      <div class="seg" id="typeSeg">
        <button type="button" class="btn active" data-type="industry">行业</button>
        <button type="button" class="btn secondary" data-type="concept">概念</button>
        <button type="button" class="btn secondary" data-type="region">地区</button>
      </div>
      <div class="seg" id="periodSeg">
        <button type="button" class="btn active" data-period="1">今日</button>
        <button type="button" class="btn secondary" data-period="5">5日</button>
        <button type="button" class="btn secondary" data-period="10">10日</button>
      </div>
      <button id="refreshBtn" class="btn" type="button">刷新</button>
      <button id="autoBtn" class="btn secondary" type="button">自动刷新：开</button>
    </div>

    <div class="meta-row">
      <span id="statusText" class="status-pill">准备就绪</span>
      <span id="asofText" class="status-pill">数据时点：-</span>
    </div>

    <div class="card">
      <div class="section-title">
        <span>📡 盘面速览</span>
        <span class="hint">基于当前列表 Top 口径</span>
      </div>
      <div class="stats" id="stats">
        <div class="stat-box"><span class="k">净流入板块</span><span class="v" id="stIn">-</span><span class="s">家</span></div>
        <div class="stat-box"><span class="k">净流出板块</span><span class="v" id="stOut">-</span><span class="s">家</span></div>
        <div class="stat-box"><span class="k">列表净额</span><span class="v" id="stNet">-</span><span class="s">亿</span></div>
        <div class="stat-box"><span class="k">最强吸金</span><span class="v" id="stTop" style="font-size:14px">-</span><span class="s" id="stTopFlow">-</span></div>
      </div>
    </div>

    <div class="cols">
      <div class="card">
        <div class="section-title">
          <span>🔥 主力净流入 Top</span>
          <span class="hint" id="inHint">今日 · 单位亿</span>
        </div>
        <div class="list" id="inList"><div class="empty">加载中…</div></div>
      </div>
      <div class="card">
        <div class="section-title">
          <span>💧 主力净流出 Top</span>
          <span class="hint" id="outHint">今日 · 单位亿</span>
        </div>
        <div class="list" id="outList"><div class="empty">加载中…</div></div>
      </div>
    </div>

    <div class="footer-note">
      数据来源：东方财富板块资金流 · 盘中约每 15 秒缓存刷新<br />
      信号为涨跌幅 + 主力净额启发式标签，仅供观察，不构成投资建议
    </div>
  </div>

  <script>
    const API_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
      ? "http://127.0.0.1:5000"
      : "https://ocr.guguji.icu";

    const state = {
      type: "industry",
      period: "1",
      top: 20,
      auto: true,
      timer: null,
      maxAbs: 1,
      openCode: null,
      membersCache: {},
    };

    const $ = (id) => document.getElementById(id);

    function fmtYi(v) {
      if (v == null || Number.isNaN(v)) return "-";
      const n = Number(v);
      const sign = n > 0 ? "+" : "";
      return sign + n.toFixed(2);
    }
    function fmtPct(v) {
      if (v == null || Number.isNaN(v)) return "-";
      const n = Number(v);
      const sign = n > 0 ? "+" : "";
      return sign + n.toFixed(2) + "%";
    }
    function toneClass(v) {
      if (v == null || Number.isNaN(v) || v === 0) return "muted";
      return v > 0 ? "up" : "down";
    }
    function signalClass(sig) {
      if (!sig) return "";
      return sig.tone || "";
    }
    function periodLabel(p) {
      return p === "5" ? "5日" : p === "10" ? "10日" : "今日";
    }

    function setActiveSeg(rootId, attr, value) {
      const root = $(rootId);
      root.querySelectorAll("button").forEach((btn) => {
        const on = btn.getAttribute(attr) === value;
        btn.classList.toggle("active", on);
        btn.classList.toggle("secondary", !on);
      });
    }

    function barWidth(mainYi, maxAbs) {
      if (mainYi == null) return 0;
      const pct = Math.min(100, (Math.abs(mainYi) / Math.max(maxAbs, 0.01)) * 100);
      return pct;
    }

    function rowHtml(item, rank, side) {
      const yi = item.main_net_yi;
      const chg = item.change_pct;
      const hot = rank <= 3;
      const open = state.openCode === item.code;
      const w = barWidth(yi, state.maxAbs);
      const sig = item.signal || {};
      return `
        <div class="row ${open ? "open" : ""}" data-code="${item.code}" data-side="${side}">
          <div class="row-top">
            <div>
              <span class="rank ${hot ? "hot" : ""}">${rank}</span>
              <span class="name">${item.name || "-"}</span>
              <span class="code">${item.code || ""}</span>
              <div class="tags">
                <span class="tag ${signalClass(sig)}">${sig.label || "中性"}</span>
                ${item.leader_name ? `<span class="tag">领涨 ${item.leader_name} ${fmtPct(item.leader_change_pct)}</span>` : ""}
                <span class="tag">↑${item.up_count || 0} ↓${item.down_count || 0}</span>
              </div>
            </div>
            <div class="right">
              <div class="flow ${toneClass(yi)}">${fmtYi(yi)}亿</div>
              <div class="chg ${toneClass(chg)}">${fmtPct(chg)}</div>
            </div>
          </div>
          <div class="bar-wrap"><div class="bar ${yi >= 0 ? "in" : "out"}" style="width:${w}%"></div></div>
          <div class="detail" ${open ? "" : "hidden"}>
            <div class="grid2">
              <div class="kv"><span>超大单</span><b class="${toneClass(item.super_net_yi)}">${fmtYi(item.super_net_yi)}亿</b></div>
              <div class="kv"><span>大单</span><b class="${toneClass(item.large_net_yi)}">${fmtYi(item.large_net_yi)}亿</b></div>
              <div class="kv"><span>中单</span><b class="${toneClass(item.mid_net_yi)}">${fmtYi(item.mid_net_yi)}亿</b></div>
              <div class="kv"><span>小单</span><b class="${toneClass(item.small_net_yi)}">${fmtYi(item.small_net_yi)}亿</b></div>
              <div class="kv"><span>今日主力</span><b class="${toneClass(item.today_main_net_yi)}">${fmtYi(item.today_main_net_yi)}亿</b></div>
              <div class="kv"><span>主力占比</span><b>${item.today_main_ratio == null ? "-" : item.today_main_ratio.toFixed(2) + "%"}</b></div>
              <div class="kv"><span>5日主力</span><b class="${toneClass(item.day5_main_net_yi)}">${fmtYi(item.day5_main_net_yi)}亿</b></div>
              <div class="kv"><span>10日主力</span><b class="${toneClass(item.day10_main_net_yi)}">${fmtYi(item.day10_main_net_yi)}亿</b></div>
            </div>
            <div class="members" id="m-${item.code}"><div class="empty">展开加载成分股…</div></div>
          </div>
        </div>`;
    }

    function renderList(el, items, side) {
      if (!items || !items.length) {
        el.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      el.innerHTML = items.map((it, i) => rowHtml(it, i + 1, side)).join("");
      el.querySelectorAll(".row").forEach((node) => {
        node.addEventListener("click", () => onToggle(node.getAttribute("data-code")));
      });
    }

    async function loadMembers(code) {
      const box = document.getElementById("m-" + code);
      if (!box) return;
      if (state.membersCache[code]) {
        box.innerHTML = state.membersCache[code];
        return;
      }
      box.innerHTML = '<div class="empty">成分股加载中…</div>';
      try {
        const url = `${API_BASE}/api/sector/${encodeURIComponent(code)}/members?limit=12&sort=in`;
        const res = await fetch(url, { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "load failed");
        const html = (data.items || []).map((m) => `
          <div class="mrow">
            <span><b>${m.name}</b> <span class="muted">${m.code}</span></span>
            <span>
              <b class="${toneClass(m.change_pct)}">${fmtPct(m.change_pct)}</b>
              · <b class="${toneClass(m.main_net_yi)}">${fmtYi(m.main_net_yi)}亿</b>
            </span>
          </div>`).join("") || '<div class="empty">无成分股数据</div>';
        state.membersCache[code] = html;
        box.innerHTML = html;
      } catch (e) {
        box.innerHTML = `<div class="empty">成分股加载失败：${e.message || e}</div>`;
      }
    }

    function onToggle(code) {
      state.openCode = state.openCode === code ? null : code;
      // re-render with current data snapshot
      if (state._last) {
        applyData(state._last);
        if (state.openCode) loadMembers(state.openCode);
      }
    }

    function applyData(data) {
      state._last = data;
      const inflow = data.inflow || [];
      const outflow = data.outflow || [];
      const all = inflow.concat(outflow);
      state.maxAbs = Math.max(0.01, ...all.map((x) => Math.abs(x.main_net_yi || 0)));

      const inCount = inflow.filter((x) => (x.main_net || 0) > 0).length;
      const outCount = outflow.filter((x) => (x.main_net || 0) < 0).length;
      const net = all.reduce((s, x) => s + (x.main_net_yi || 0), 0) / 2; // dual lists overlap less; rough
      // better: sum inflow page only for "列表净额" use summary if present
      const pageNet = data.summary?.inflow?.page_main_net_yi;
      $("stIn").textContent = data.summary?.inflow?.inflow_count ?? inCount;
      $("stOut").textContent = data.summary?.outflow?.outflow_count ?? outCount;
      $("stNet").textContent = pageNet == null ? fmtYi(net).replace("+","") : Number(pageNet).toFixed(2);
      $("stNet").className = "v " + toneClass(pageNet ?? net);
      const top = inflow[0];
      $("stTop").textContent = top?.name || "-";
      $("stTopFlow").textContent = top ? `${fmtYi(top.main_net_yi)}亿 · ${fmtPct(top.change_pct)}` : "-";

      $("inHint").textContent = `${periodLabel(state.period)} · 单位亿`;
      $("outHint").textContent = `${periodLabel(state.period)} · 单位亿`;
      $("asofText").textContent = `数据时点：${data.asof || "-"}`;

      renderList($("inList"), inflow, "in");
      renderList($("outList"), outflow, "out");
      if (state.openCode) loadMembers(state.openCode);
    }

    async function refresh(manual = false) {
      const btn = $("refreshBtn");
      btn.disabled = true;
      $("statusText").textContent = manual ? "手动刷新中…" : "刷新中…";
      try {
        const q = new URLSearchParams({
          type: state.type,
          period: state.period,
          top: String(state.top),
          primary_only: "1",
          refresh: manual ? "1" : "0",
        });
        const res = await fetch(`${API_BASE}/api/sector/dual?${q}`, { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "接口失败");
        applyData(data);
        $("statusText").innerHTML = state.auto
          ? '已更新 · <span class="auto-on">自动刷新中</span>'
          : "已更新";
      } catch (e) {
        $("statusText").textContent = `失败：${e.message || e}`;
        if (!$("inList").dataset.ready) {
          $("inList").innerHTML = `<div class="empty">加载失败：${e.message || e}</div>`;
          $("outList").innerHTML = `<div class="empty">加载失败：${e.message || e}</div>`;
        }
      } finally {
        btn.disabled = false;
        $("inList").dataset.ready = "1";
      }
    }

    function setupAuto() {
      if (state.timer) clearInterval(state.timer);
      state.timer = null;
      $("autoBtn").textContent = state.auto ? "自动刷新：开" : "自动刷新：关";
      $("autoBtn").classList.toggle("active", state.auto);
      $("autoBtn").classList.toggle("secondary", !state.auto);
      if (state.auto) {
        state.timer = setInterval(() => refresh(false), 30000);
      }
    }

    $("typeSeg").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-type]");
      if (!btn) return;
      state.type = btn.getAttribute("data-type");
      state.openCode = null;
      state.membersCache = {};
      setActiveSeg("typeSeg", "data-type", state.type);
      refresh(true);
    });
    $("periodSeg").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-period]");
      if (!btn) return;
      state.period = btn.getAttribute("data-period");
      state.openCode = null;
      setActiveSeg("periodSeg", "data-period", state.period);
      refresh(true);
    });
    $("refreshBtn").addEventListener("click", () => refresh(true));
    $("autoBtn").addEventListener("click", () => {
      state.auto = !state.auto;
      setupAuto();
      $("statusText").innerHTML = state.auto
        ? '自动刷新已开启'
        : "自动刷新已关闭";
    });

    setupAuto();
    refresh(true);
  </script>
</body>
</html>
